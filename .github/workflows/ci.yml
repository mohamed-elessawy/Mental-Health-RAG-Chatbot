name: Serenity Backend CI/CD Pipeline

on:
  push:
    branches:
      - mlops

jobs:
  # 1. Lint + Unit Tests
  lint-and-test:
    name: Code Quality and Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --frozen --dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Run Unit Tests
        run: uv run pytest -v -m "not slow"


  # 2. Build & Push Docker Image
  build-and-push:
    name: Build and Push Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Image Tag
        id: tag
        run: echo "TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/serenity-backend:${{ steps.tag.outputs.TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/serenity-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


# 3. Deploy to Hugging Face Spaces
  deploy-to-huggingface:
    name: Deploy to Hugging Face Spaces
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch the entire history for proper git operations (HF Spaces requires full history for deployment)

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # 1. Completely delete the Git tracking folder inside the runner
          rm -rf .git

          # 2. Re-initialize a brand new, empty Git environment
          git init -b main

          # 3. Configure the temporary automation identity
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 4. Stage everything except assets/. HF git repos route binaries
          #    through Git LFS, so pushing raw PNGs triggers a "binary files"
          #    warning and they will not render. The README points at the
          #    GitHub-hosted copies of these images instead.
          git add .
          git rm -rf --cached assets/ || true

          # 5. Commit it as a single, fresh deployment commit
          git commit -m "deploy: initial clean release to hugging face"

          # 6. Force push this single clean commit to Hugging Face
          git push -f \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" \
            main
