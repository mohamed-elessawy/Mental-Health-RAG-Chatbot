[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["deployment/tests"]
python_files = "test_*.py"
markers = ["slow: requires real models on disk (downloads if missing)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deployment"]
