[project]
name = "mental-health-rag-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn>=0.48.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.0",
    "litellm>=1.86.0",
    "groq>=1.2.0",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.5.0",
    "transformers>=5.9.0",
    "torch>=2.12.0",
    "accelerate>=1.13.0",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "numpy>=2.4.0",
    "joblib>=1.5.0",
    "gdown>=6.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "streamlit>=1.58.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "pandas>=3.0.0",
    "datasets>=4.8.0",
    "evaluate>=0.4.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["deployment/tests"]
python_files = "test_*.py"
markers = ["slow: requires real models on disk (downloads if missing)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deployment"]
